name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  desktop:
    runs-on: ubuntu-latest
    name: Desktop — validate, lint, test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation harness
        run: npm run validate:docs

      - name: Validate architecture boundaries
        run: npm run validate:architecture

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

  web:
    runs-on: ubuntu-latest
    name: Web — build, wrangler dry-run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run
